# Cloudflare Tunnel — mingler.cc register sync (The Mingler)
#
# Public URL: https://sync.mingler.cc/api/register/sync
# Bot listens: http://127.0.0.1:3847
#
# Setup:
#   cloudflared tunnel login
#   cloudflared tunnel create mingler-register-sync
#   cloudflared tunnel route dns mingler-register-sync sync.mingler.cc
#
# Edit credentials-file below, then run:
#   cloudflared tunnel --config path\to\this\file run mingler-register-sync
#
# Docs: docs/REGISTER_SYNC_DEPLOYMENT.md
#       scripts/ops/README-mingler.cc.md

tunnel: mingler-register-sync
credentials-file: C:\Users\YOU\.cloudflared\TUNNEL-UUID-HERE.json

ingress:
  - hostname: sync.mingler.cc
    service: http://127.0.0.1:3847
  - service: http_status:404
